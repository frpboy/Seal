gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    app.tasks.register('qualifyNativeResolution') {
        doLast {
            def android = app.extensions.getByName('android')
            assert app.providers.gradleProperty('noSplits').isPresent()
            assert app.providers.gradleProperty('ABI_FILTERS').get() == 'arm64-v8a;armeabi-v7a;x86_64;x86'
            def diagnostic = android.buildTypes.getByName('nativeQualification')
            assert diagnostic.signingConfig == null && diagnostic.debuggable
            assert diagnostic.applicationIdSuffix == '.nativequalification'
            assert diagnostic.versionNameSuffix == '-native-qualification'
            def evidence = new File(gradle.rootProject.projectDir, 'qualification-evidence')
            evidence.mkdirs()
            // Existing noSplits output rule adds first ABI code: arm64-v8a = 2.
            new File(evidence, 'expected-identity.json').text = groovy.json.JsonOutput.toJson([
                package: android.defaultConfig.applicationId + diagnostic.applicationIdSuffix,
                version_name: android.defaultConfig.versionName + diagnostic.versionNameSuffix,
                version_code: android.defaultConfig.versionCode + 2]) + '\n'
            def marker = org.gradle.api.attributes.Attribute.of('com.frpboy.seali.webp16k', Boolean)
            ['genericNativeQualificationCompileClasspath', 'genericNativeQualificationRuntimeClasspath'].each { name ->
                def config = app.configurations.getByName(name)
                assert config.attributes.getAttribute(marker) == true : "Missing native marker for $name"
                def artifacts = config.incoming.artifactView {
                    attributes.attribute(org.gradle.api.artifacts.type.ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'aar')
                    componentFilter { id -> id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier && id.group == 'io.github.junkfood02.youtubedl-android' && id.module == 'ffmpeg' }
                }.artifacts.artifacts
                assert artifacts.size() == 1 : "Expected one FFmpeg AAR for $name: $artifacts"
                def artifact = artifacts.first()
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                artifact.file.withInputStream { stream -> byte[] buffer = new byte[1024*1024]; int read; while ((read=stream.read(buffer)) >= 0) digest.update(buffer,0,read) }
                def actual = digest.digest().encodeHex().toString()
                assert actual == '6755c855f9e86a942b6819374093d9cee6265fed1723e7c326f3969f68b36af3' : "Unpatched FFmpeg for $name: $actual"
                def components = config.incoming.resolutionResult.allComponents.collect { it.id.displayName }.sort()
                def baseline = config.copyRecursive()
                baseline.attributes.attribute(marker, false)
                def baselineComponents = baseline.incoming.resolutionResult.allComponents.collect { it.id.displayName }.findAll { !it.startsWith('root project') }.sort()
                def candidateComponents = components.findAll { !it.startsWith('root project') }
                assert candidateComponents == baselineComponents : 'Native transform changed resolved component graph'

                assert artifact.id.componentIdentifier.displayName == 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
                def out = new File(gradle.rootProject.projectDir, 'qualification-evidence')
                out.mkdirs()
                new File(out, name + '.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                    configuration: name, component: artifact.id.componentIdentifier.displayName,
                    aar_sha256: actual, components: components, baseline_components: baselineComponents])) + '\n'
                println "PASS $name attribute=true component=${artifact.id.componentIdentifier} AAR_SHA256=$actual file=${artifact.file}"
            }
        }
    }
}
