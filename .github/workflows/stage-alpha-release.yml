name: Stage alpha prerelease

# Release staging is deliberately manual. Routine push and pull request runs
# of android_ci.yml publish no APK artifacts by design; the only run that can
# satisfy this contract is a manual android_ci.yml dispatch started with
# publish_apk_artifacts=true on the intended commit. This workflow stages a
# DRAFT prerelease from that run's artifacts; the tag is created only if and
# when the draft is published.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Manual Android CI dispatch run ID (started with publish_apk_artifacts=true) whose artifacts become the release assets"
        required: true
      tag:
        description: "Release tag (created only if and when the draft is published)"
        required: true
        default: "v2.0.0-alpha.6"
      title:
        description: "Draft release title"
        required: true
        default: "Seali 2.0.0-alpha.6 (alpha prerelease)"
      target:
        description: "Commit the release targets"
        required: true
      notes:
        description: "Draft release notes (reviewed before publishing)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate source run matches target commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          TARGET: ${{ inputs.target }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid run ID"; exit 1; }
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: target must be a full commit SHA"; exit 1; }
          [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "ERROR: invalid version tag"; exit 1; }
          # The Android updater reads the first version in the release title.
          # Validate before downloading assets or creating a draft.
          python3 - <<'PYVERSION'
          import os, re
          tag = os.environ['TAG']
          title = os.environ['TITLE']
          version = re.compile(r'v?(\d+)\.(\d+)\.(\d+)(-(\w+)\.(\d+))?')
          expected = re.fullmatch(r'v(\d+)\.(\d+)\.(\d+)-alpha\.(\d+)', tag)
          actual = version.search(title)
          if not expected or not actual:
              raise SystemExit('ERROR: alpha tag and a parseable release title are required')
          expected_parts = tuple(map(int, expected.groups()))
          actual_parts = tuple(int(actual.group(i)) for i in (1, 2, 3, 6)) if actual.group(5) == 'alpha' else None
          if any(part > 2_147_483_647 for part in expected_parts):
              raise SystemExit('ERROR: version components must fit in a Kotlin Int')
          if actual_parts != expected_parts:
              raise SystemExit('ERROR: release title version does not match alpha tag')
          PYVERSION
          MAIN_SHA=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          [ "$TARGET" = "$MAIN_SHA" ] || { echo "ERROR: target must be current main to avoid workflow-permission tag failures"; exit 1; }
          TAGS=$(gh api "repos/$REPOSITORY/git/matching-refs/tags/$TAG")
          [ "$(echo "$TAGS" | jq --arg tag "refs/tags/$TAG" '[.[] | select(.ref == $tag)] | length')" -eq 0 ] || { echo "ERROR: tag already exists; refusing ambiguous release target"; exit 1; }
          RUN_JSON=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID")
          HEAD_SHA=$(echo "$RUN_JSON" | jq -r .head_sha)
          CONCLUSION=$(echo "$RUN_JSON" | jq -r .conclusion)
          HEAD_REPO=$(echo "$RUN_JSON" | jq -r .head_repository.full_name)
          EVENT=$(echo "$RUN_JSON" | jq -r .event)
          WORKFLOW=$(echo "$RUN_JSON" | jq -r .path)
          case "$WORKFLOW" in
            .github/workflows/android_ci.yml)
              ;;
            .github/workflows/android.yml)
              CALL_SHA=$(echo "$RUN_JSON" | jq -r '.referenced_workflows[]? | select(.path | contains("/.github/workflows/android_ci.yml@")) | .sha' | head -n 1)
              [ "$CALL_SHA" = "$TARGET" ] || { echo "ERROR: manual release wrapper did not call the canonical Android CI workflow at the target commit"; exit 1; }
              ;;
            *)
              echo "ERROR: unsupported artifact workflow: $WORKFLOW"
              exit 1
              ;;
          esac
          echo "run head_sha=$HEAD_SHA conclusion=$CONCLUSION repo=$HEAD_REPO event=$EVENT target=$TARGET"
          [ "$CONCLUSION" = "success" ] || { echo "ERROR: source run did not succeed"; exit 1; }
          [ "$HEAD_SHA" = "$TARGET" ] || { echo "ERROR: run head SHA does not match target commit"; exit 1; }
          [ "$HEAD_REPO" = "$REPOSITORY" ] || { echo "ERROR: run comes from another repository (untrusted fork run)"; exit 1; }
          case "$EVENT" in workflow_dispatch) ;; *) echo "ERROR: source run must be a manual workflow_dispatch run of android_ci.yml (push and pull request runs publish no artifacts by design); got $EVENT"; exit 1 ;; esac

      - name: Download built APK artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}
          pattern: "seali-*"
          path: artifacts

      - name: Set up APK metadata tools
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0

      - name: Verify every APK version matches the proposed tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          export AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          python3 - <<'PYAPK'
          import os, pathlib, re, subprocess
          apks = list(pathlib.Path('artifacts').rglob('*.apk'))
          if len(apks) != 5:
              raise SystemExit('ERROR: expected exactly five APKs')
          expected = os.environ['TAG'].removeprefix('v')
          for apk in apks:
              output = subprocess.check_output([os.environ['AAPT'], 'dump', 'badging', str(apk)], text=True)
              version = re.search(r"^package:.*?versionName='([^']+)'", output, re.MULTILINE)
              if not version or version.group(1) != expected:
                  raise SystemExit(f'ERROR: {apk.name} version does not match tag')
          PYAPK

      - name: Verify SHA-256 manifest matches all five APKs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSHA'
          import hashlib
          import pathlib
          import re

          root = pathlib.Path("artifacts")
          manifest = root / "seali-checksums" / "SHA256SUMS"
          if not manifest.is_file() or manifest.stat().st_size == 0:
              raise SystemExit("ERROR: signed APK SHA256SUMS artifact is missing or empty")

          apks = sorted(root.rglob("*.apk"))
          if len(apks) != 5:
              raise SystemExit(f"ERROR: expected five APKs, found {len(apks)}")
          suffixes = ("-universal.apk", "-arm64-v8a.apk", "-armeabi-v7a.apk", "-x86.apk", "-x86_64.apk")
          for suffix in suffixes:
              matches = [apk for apk in apks if apk.name.endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit(f"ERROR: expected exactly one {suffix} APK, found {len(matches)}")
          if any(apk.stat().st_size <= 0 for apk in apks):
              raise SystemExit("ERROR: an APK artifact is empty")

          expected = {}
          for line in manifest.read_text().splitlines():
              fields = line.split(maxsplit=1)
              if len(fields) != 2:
                  raise SystemExit("ERROR: malformed SHA256SUMS entry")
              digest, filename = fields
              filename = filename.lstrip("* ")
              if not re.fullmatch(r"[A-Za-z0-9._-]+\.apk", filename) or filename in expected:
                  raise SystemExit("ERROR: invalid or duplicate APK filename in SHA256SUMS")
              if not re.fullmatch(r"[0-9a-fA-F]{64}", digest):
                  raise SystemExit("ERROR: invalid SHA-256 digest in SHA256SUMS")
              expected[filename] = digest.lower()

          if len(expected) != 5 or set(expected) != {apk.name for apk in apks}:
              raise SystemExit("ERROR: SHA256SUMS does not cover exactly the five APK assets")
          for apk in apks:
              actual = hashlib.sha256(apk.read_bytes()).hexdigest()
              if actual != expected[apk.name]:
                  raise SystemExit(f"ERROR: SHA-256 mismatch for {apk.name}")
          print("Verified non-empty APKs and SHA-256 checksums for universal, ARM64, ARMv7, x86 and x86_64.")
          PYSHA

      - name: Create draft prerelease with APK assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          find artifacts -name '*.apk' -print
          APK_COUNT=$(find artifacts -name '*.apk' | wc -l)
          [ "$APK_COUNT" -eq 5 ] || { echo "ERROR: expected 5 APKs, found $APK_COUNT"; exit 1; }
          test -s artifacts/seali-checksums/SHA256SUMS
          for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
            mapfile -t apks < <(find "artifacts/seali-$abi" -maxdepth 1 -type f -name "*-$abi.apk")
            [ "${#apks[@]}" -eq 1 ] || { echo "ERROR: expected one APK per ABI"; exit 1; }
          done
          gh release create "$TAG" \
            --draft \
            --prerelease \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$TARGET" \
            artifacts/seali-universal/*.apk \
            artifacts/seali-arm64-v8a/*.apk \
            artifacts/seali-armeabi-v7a/*.apk \
            artifacts/seali-x86/*.apk \
            artifacts/seali-x86_64/*.apk \
            artifacts/seali-checksums/SHA256SUMS
