name: Classic history UI qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v3
      - name: Enable standard runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew connectedGenericDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.junkfood.seal.ClassicHomeHistoryTest
            adb pull /data/local/tmp/classic-history.png classic-history.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-history-ui-evidence
          path: |
            classic-history.png
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
