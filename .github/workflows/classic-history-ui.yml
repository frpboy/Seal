name: Bounded x86_64 functional native build
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed source commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  native-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bind exact reviewed build source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = frpboy/Seali
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(sha256sum scripts/native-mincut/build-minimal-ffmpeg.sh | cut -d ' ' -f1)" = ffc8ac51aa65b4c590a4effb2119a4de0ab1cdbdd32f78bb43abb3ac1a6b30a5
          echo "SOURCE_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
      - name: Read-only inputs and host preflight, safe source preparation
        id: prepare
        run: timeout --signal=TERM --kill-after=30s 600 python3 scripts/native-mincut/prepare-native-job.py
      - name: Measure one x86_64 native build only
        id: build
        run: timeout --signal=TERM --kill-after=30s 3600 bash scripts/native-mincut/build-minimal-ffmpeg.sh
      - name: Capture exact ELF and relink evidence
        if: success()
        run: bash scripts/native-mincut/postbuild-evidence.sh
      - name: Encrypt full build custody for review
        id: encrypt
        if: always() && steps.prepare.outcome == 'success'
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: python3 scripts/native-mincut/encrypt-native-custody.py
      - name: Retain ciphertext only
        if: always() && steps.encrypt.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: functional-native-x86_64-encrypted
          path: ${{ runner.temp }}/native-build.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove transient custody data
        if: always()
        run: rm -rf "$RUNNER_TEMP/seali-native-job" "$RUNNER_TEMP/seali-native-build.tar.gz" "$RUNNER_TEMP/native-build.cms" "$RUNNER_TEMP/native-build.cms.tmp"
