name: Validate existing Seali signing secrets
on:
  workflow_dispatch:
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout, dependencies, Gradle, APK build, upload or publication.
      - name: Verify existing secret identity and private-key access
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SEALI_UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.SEALI_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SEALI_UPLOAD_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.SEALI_UPLOAD_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/seali-signing.XXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            test -n "${!name}" || { echo 'FAIL: required signing secret is empty'; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$work/key.p12"
          test -s "$work/key.p12"
          magic="$(od -An -tx1 -N4 "$work/key.p12" | tr -d '[:space:]')"
          case "$magic" in
            feedfeed) store_type=JKS ;;
            30*) store_type=PKCS12 ;;
            *) echo 'FAIL: decoded secret is not a recognized binary keystore'; exit 1 ;;
          esac
          if ! keytool -exportcert -alias "$KEY_ALIAS" -keystore "$work/key.p12" -storetype "$store_type" -storepass:env STORE_PASSWORD -file "$work/cert.der" > "$work/tool.log" 2>&1; then
            echo 'FAIL: existing keystore password or alias cannot open the certificate'; exit 1
          fi
          actual="$(sha256sum "$work/cert.der" | cut -d ' ' -f1)"
          expected=88774e5211b61f7827db0ba6991a668000ceab9a9e9490648054b8a19b6e070f
          test "$actual" = "$expected" || { echo 'FAIL: signing certificate differs from public alpha.5'; exit 1; }
          if ! keytool -certreq -alias "$KEY_ALIAS" -keystore "$work/key.p12" -storetype "$store_type" -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD -file "$work/check.csr" > "$work/tool.log" 2>&1; then
            echo 'FAIL: existing private-key password cannot unlock this key'; exit 1
          fi
          echo 'PASS: four existing secrets unlock the alpha.5 signing identity. No APK built or published.'
