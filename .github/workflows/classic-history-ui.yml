name: Private synthetic APK install diagnostic only
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed diagnostic source SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  sdk-only-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Bind reviewed isolated source without native or App builds
        timeout-minutes: 1
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test ! -e keystore.properties
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        timeout-minutes: 3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        timeout-minutes: 5
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-34 build-tools;36.0.0
      - name: Selected SDK and single harmless synthetic install probe
        timeout-minutes: 50
        id: diagnostics
        run: python3 scripts/install-probe/probe.py
      - name: Encrypt diagnostics only even after setup or boot failure
        if: always()
        timeout-minutes: 1
        id: encrypt
        run: python3 scripts/install-probe/encrypt.py
      - name: Retain private bounded diagnostics ciphertext
        if: always() && steps.encrypt.outcome == 'success'
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-sdk-setup-boot-diagnostics-encrypted
          path: ${{ runner.temp }}/seali-sdk-diagnostics/sdk-diagnostics.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove only diagnostic synthetic guest and evidence
        timeout-minutes: 1
        if: always()
        run: rm -rf "$RUNNER_TEMP/seali-sdk-diagnostics"
