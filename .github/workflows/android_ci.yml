name: Android CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package is no longer published.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run generic debug unit tests
        run: ./gradlew testGenericDebugUnitTest

      - name: Build generic release APK variants
        run: ./gradlew assembleGenericRelease

      # Keep each ABI downloadable on its own. The universal APK is provided
      # separately for users who do not know which device architecture to pick.
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: seali-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: seali-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: seali-x86
          path: app/build/outputs/apk/generic/release/*x86-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: seali-x86_64
          path: app/build/outputs/apk/generic/release/*x86_64*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: seali-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: error
          retention-days: 14
