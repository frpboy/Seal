name: Android CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package is no longer published.
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      # Release artifacts must never be published unsigned. PRs without secrets
      # still run the debug test suite; main/tag/manual builds require signing.
      - name: Validate and stage private Play upload key
        id: signing
        shell: bash
        env:
          SEALI_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SEALI_UPLOAD_KEYSTORE_BASE64 }}
          SEALI_UPLOAD_KEY_ALIAS: ${{ secrets.SEALI_UPLOAD_KEY_ALIAS }}
          SEALI_UPLOAD_KEY_PASSWORD: ${{ secrets.SEALI_UPLOAD_KEY_PASSWORD }}
          SEALI_UPLOAD_STORE_PASSWORD: ${{ secrets.SEALI_UPLOAD_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$SEALI_UPLOAD_KEYSTORE_BASE64" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -z "$SEALI_UPLOAD_KEY_ALIAS$SEALI_UPLOAD_KEY_PASSWORD$SEALI_UPLOAD_STORE_PASSWORD" ]]; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Signing secrets are unavailable to this pull request; release packaging is safely skipped."
              exit 0
            fi
            echo "::error::Missing SEALI_UPLOAD_KEYSTORE_BASE64. Configure the four Seali upload-signing repository secrets before running a release build."
            exit 1
          fi

          for name in SEALI_UPLOAD_KEY_ALIAS SEALI_UPLOAD_KEY_PASSWORD SEALI_UPLOAD_STORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done

          umask 077
          key_file="app/seali-upload-key.jks"
          printf '%s' "$SEALI_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          if [[ ! -s "$key_file" ]]; then
            echo "::error::The decoded upload keystore is empty."
            exit 1
          fi
          chmod 600 "$key_file"

          check_log="$RUNNER_TEMP/seali-keystore-check.log"
          if ! keytool -list -v \
            -keystore "$key_file" \
            -storetype JKS \
            -storepass:env SEALI_UPLOAD_STORE_PASSWORD \
            -alias "$SEALI_UPLOAD_KEY_ALIAS" > "$check_log" 2>&1; then
            rm -f "$check_log"
            echo "::error::The decoded upload keystore is not a readable JKS keystore for the configured store password and alias. Replace the keystore secret with base64 of the original .jks file."
            exit 1
          fi

          if ! grep -q "Entry type: PrivateKeyEntry" "$check_log"; then
            rm -f "$check_log"
            echo "::error::The configured alias is not a private-key entry. A certificate-only keystore cannot sign Seali releases."
            exit 1
          fi
          rm -f "$check_log"

          # A CSR operation proves the private-key password can unlock the key
          # without changing the keystore or exposing its contents.
          if ! keytool -certreq \
            -alias "$SEALI_UPLOAD_KEY_ALIAS" \
            -keystore "$key_file" \
            -storetype JKS \
            -storepass:env SEALI_UPLOAD_STORE_PASSWORD \
            -keypass:env SEALI_UPLOAD_KEY_PASSWORD \
            -file "$RUNNER_TEMP/seali-upload-key-check.csr" \
            > /dev/null 2>&1; then
            rm -f "$RUNNER_TEMP/seali-upload-key-check.csr"
            echo "::error::The configured private-key password cannot unlock the selected upload key."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/seali-upload-key-check.csr"

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Upload keystore format, alias, store password, and private-key password validated."

      - name: Run generic debug unit tests
        run: ./gradlew testGenericDebugUnitTest

      - name: Build generic release APK variants
        if: steps.signing.outputs.available == 'true'
        env:
          SEALI_UPLOAD_KEY_ALIAS: ${{ secrets.SEALI_UPLOAD_KEY_ALIAS }}
          SEALI_UPLOAD_KEY_PASSWORD: ${{ secrets.SEALI_UPLOAD_KEY_PASSWORD }}
          SEALI_UPLOAD_STORE_PASSWORD: ${{ secrets.SEALI_UPLOAD_STORE_PASSWORD }}
          SEALI_UPLOAD_KEYSTORE_FILE: app/seali-upload-key.jks
        run: ./gradlew assembleGenericRelease

      # Play App Bundles own ABI delivery; disable APK split outputs for this task.
      - name: Build Google Play App Bundle
        if: steps.signing.outputs.available == 'true'
        env:
          SEALI_UPLOAD_KEY_ALIAS: ${{ secrets.SEALI_UPLOAD_KEY_ALIAS }}
          SEALI_UPLOAD_KEY_PASSWORD: ${{ secrets.SEALI_UPLOAD_KEY_PASSWORD }}
          SEALI_UPLOAD_STORE_PASSWORD: ${{ secrets.SEALI_UPLOAD_STORE_PASSWORD }}
          SEALI_UPLOAD_KEYSTORE_FILE: app/seali-upload-key.jks
        run: ./gradlew bundleGenericRelease -PnoSplits

      - name: Verify APK and AAB signatures against the upload certificate
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          SEALI_UPLOAD_KEY_ALIAS: ${{ secrets.SEALI_UPLOAD_KEY_ALIAS }}
          SEALI_UPLOAD_STORE_PASSWORD: ${{ secrets.SEALI_UPLOAD_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          keystore="app/seali-upload-key.jks"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          apk_dir="app/build/outputs/apk/generic/release"
          aab_dir="app/build/outputs/bundle/genericRelease"

          expected_fingerprint="$(
            keytool -exportcert \
              -alias "$SEALI_UPLOAD_KEY_ALIAS" \
              -keystore "$keystore" \
              -storetype JKS \
              -storepass:env SEALI_UPLOAD_STORE_PASSWORD \
              | openssl dgst -sha256 \
              | awk '{ print tolower($NF) }'
          )"

          mapfile -t apks < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' | sort)
          if [[ "${#apks[@]}" -ne 5 ]]; then
            echo "::error::Expected five ABI/universal APKs, found ${#apks[@]}."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            signer_output="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1)"
            actual_fingerprint="$(
              printf '%s\n' "$signer_output" \
                | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([[:xdigit:]:]+)$/\1/p' \
                | head -n 1 \
                | tr -d ':' \
                | tr '[:upper:]' '[:lower:]'
            )"
            if [[ -z "$actual_fingerprint" || "$actual_fingerprint" != "$expected_fingerprint" ]]; then
              echo "::error::APK signature verification failed or the APK was signed with a different certificate: $(basename "$apk")"
              exit 1
            fi
          done

          mapfile -t aabs < <(find "$aab_dir" -maxdepth 1 -type f -name '*.aab' | sort)
          if [[ "${#aabs[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Google Play AAB, found ${#aabs[@]}."
            exit 1
          fi

          jarsigner -verify "${aabs[0]}" > /dev/null
          aab_fingerprint="$(
            keytool -printcert -jarfile "${aabs[0]}" 2>/dev/null \
              | sed -nE 's/^[[:space:]]*SHA256: ([[:xdigit:]:]+).*$/\1/p' \
              | head -n 1 \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"
          if [[ -z "$aab_fingerprint" || "$aab_fingerprint" != "$expected_fingerprint" ]]; then
            echo "::error::The AAB is unsigned, invalid, or signed with a different certificate."
            exit 1
          fi

          echo "Verified all five APKs and the Google Play AAB against the configured upload certificate."

      - name: Prepare individually named release APKs
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_dir="app/build/outputs/apk/generic/release"
          output_dir="release-assets"
          mkdir -p "$output_dir"

          find_one() {
            local label="$1"
            local pattern="$2"
            mapfile -t matches < <(find "$source_dir" -maxdepth 1 -type f -name "$pattern" | sort)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one $label APK matching $pattern; found ${#matches[@]}"
              find "$source_dir" -maxdepth 1 -type f -name '*.apk' -printf '%f\\n'
              exit 1
            fi
            cp "${matches[0]}" "$output_dir/Seali-${GITHUB_REF_NAME}-$label.apk"
          }

          find_one arm64-v8a '*-arm64-v8a-release.apk'
          find_one armeabi-v7a '*-armeabi-v7a-release.apk'
          find_one x86_64 '*-x86_64-release.apk'
          find_one x86 '*-x86-release.apk'

          mapfile -t universal < <(find "$source_dir" -maxdepth 1 -type f -name '*.apk' ! -name '*-arm64-v8a-release.apk' ! -name '*-armeabi-v7a-release.apk' ! -name '*-x86-release.apk' ! -name '*-x86_64-release.apk' | sort)
          if [ "${#universal[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one universal APK; found ${#universal[@]}"
            find "$source_dir" -maxdepth 1 -type f -name '*.apk' -printf '%f\\n'
            exit 1
          fi
          cp "${universal[0]}" "$output_dir/Seali-${GITHUB_REF_NAME}-universal.apk"
          ls -lh "$output_dir"

      - name: Upload Google Play App Bundle
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seali-google-play-aab
          path: app/build/outputs/bundle/genericRelease/*.aab
          if-no-files-found: error
          retention-days: 14

      # Keep each ABI downloadable on its own from the Actions run.
      - name: Upload ARM64 APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seali-arm64-v8a
          path: release-assets/*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARMv7 APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seali-armeabi-v7a
          path: release-assets/*-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seali-x86
          path: release-assets/*-x86.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seali-x86_64
          path: release-assets/*-x86_64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload universal APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seali-universal
          path: release-assets/*-universal.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release with separate APK assets
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Seali ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.apk
          fail_on_unmatched_files: true
          make_latest: true
