name: Android CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package is no longer published.
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Configure private Play upload signing key
        shell: bash
        env:
          SEALI_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SEALI_UPLOAD_KEYSTORE_BASE64 }}
          SEALI_UPLOAD_KEY_ALIAS: ${{ secrets.SEALI_UPLOAD_KEY_ALIAS }}
          SEALI_UPLOAD_KEY_PASSWORD: ${{ secrets.SEALI_UPLOAD_KEY_PASSWORD }}
          SEALI_UPLOAD_STORE_PASSWORD: ${{ secrets.SEALI_UPLOAD_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SEALI_UPLOAD_KEYSTORE_BASE64}" ]; then
            echo "::warning::Play upload signing secrets are not configured; the AAB will be unsigned."
            exit 0
          fi
          for name in SEALI_UPLOAD_KEY_ALIAS SEALI_UPLOAD_KEY_PASSWORD SEALI_UPLOAD_STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          printf '%s' "$SEALI_UPLOAD_KEYSTORE_BASE64" | base64 --decode > app/seali-upload-key.jks
          cat > keystore.properties <<EOF
          keyAlias=$SEALI_UPLOAD_KEY_ALIAS
          keyPassword=$SEALI_UPLOAD_KEY_PASSWORD
          storeFile=app/seali-upload-key.jks
          storePassword=$SEALI_UPLOAD_STORE_PASSWORD
          EOF
          echo "Play upload signing configured."


      - name: Run generic debug unit tests
        run: ./gradlew testGenericDebugUnitTest

      - name: Build generic release APK variants
        run: ./gradlew assembleGenericRelease

      # Play App Bundles own ABI delivery; disable APK split outputs for this task.
      - name: Build Google Play App Bundle
        run: ./gradlew bundleGenericRelease -PnoSplits

      - name: Prepare individually named release APKs
        shell: bash
        run: |
          set -euo pipefail
          source_dir="app/build/outputs/apk/generic/release"
          output_dir="release-assets"
          mkdir -p "$output_dir"

          find_one() {
            local label="$1"
            local pattern="$2"
            mapfile -t matches < <(find "$source_dir" -maxdepth 1 -type f -name "$pattern" | sort)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one $label APK matching $pattern; found ${#matches[@]}"
              find "$source_dir" -maxdepth 1 -type f -name '*.apk' -printf '%f\\n'
              exit 1
            fi
            cp "${matches[0]}" "$output_dir/Seali-${GITHUB_REF_NAME}-$label.apk"
          }

          find_one arm64-v8a '*-arm64-v8a.apk'
          find_one armeabi-v7a '*-armeabi-v7a.apk'
          find_one x86_64 '*-x86_64.apk'
          find_one x86 '*-x86.apk'

          mapfile -t universal < <(find "$source_dir" -maxdepth 1 -type f -name '*.apk' ! -name '*-arm64-v8a.apk' ! -name '*-armeabi-v7a.apk' ! -name '*-x86.apk' ! -name '*-x86_64.apk' | sort)
          if [ "${#universal[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one universal APK; found ${#universal[@]}"
            find "$source_dir" -maxdepth 1 -type f -name '*.apk' -printf '%f\\n'
            exit 1
          fi
          cp "${universal[0]}" "$output_dir/Seali-${GITHUB_REF_NAME}-universal.apk"
          ls -lh "$output_dir"

      - name: Upload Google Play App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: seali-google-play-aab
          path: app/build/outputs/bundle/genericRelease/*.aab
          if-no-files-found: error
          retention-days: 14

      # Keep each ABI downloadable on its own from the Actions run.
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: seali-arm64-v8a
          path: release-assets/*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: seali-armeabi-v7a
          path: release-assets/*-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: seali-x86
          path: release-assets/*-x86.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: seali-x86_64
          path: release-assets/*-x86_64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: seali-universal
          path: release-assets/*-universal.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release with separate APK assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Seali ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.apk
          fail_on_unmatched_files: true
          make_latest: true
