name: Android CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package is no longer published.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run generic debug unit tests
        run: ./gradlew testGenericDebugUnitTest

      - name: Build generic release APK
        run: ./gradlew assembleGenericRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: seali-generic-release
          path: app/build/outputs/apk/generic/release/*.apk
          if-no-files-found: error
          retention-days: 14
