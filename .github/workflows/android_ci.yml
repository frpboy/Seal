name: Android CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      qualify_maven_consumer:
        description: 'Isolated source-only Maven consumer qualification, no APK or signing'
        type: boolean
        required: false
        default: false
      expected_qualification_sha:
        description: 'Exact reviewed isolated consumer commit, required for qualification mode'
        type: string
        required: false
      build_release:
        description: 'Explicitly build owner-signed release APKs/AAB (separate from verification; no upload unless approved)'
        type: boolean
        required: false
        default: false
      run_history_ui:
        description: 'Run the Android history UI check on an existing KVM-capable runner'
        type: boolean
        required: false
        default: false
      publish_apk_artifacts:
        description: 'Publish qualified generic APKs as public Actions artifacts (requires distribution approval)'
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      build_release:
        description: 'Build owner-signed release APKs/AAB'
        type: boolean
        required: false
        default: false
      run_history_ui:
        description: 'Run the Android history UI check on an existing KVM-capable runner'
        type: boolean
        required: false
        default: false
      publish_apk_artifacts:
        description: 'Publish qualified APKs as Actions artifacts'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.qualify_maven_consumer != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # GITHUB_TOKEN needs contents:write solely for "Stage private draft release
    # assets" (draft-release creation). Per-step permissions do not exist, and a
    # separate retention job would have to move signed bytes through public
    # Actions artifacts, so this job is the least-privileged place. Under
    # workflow_call the token can only narrow caller-granted permissions, so the
    # android.yml caller grants contents:write as well; a caller without it
    # fails loudly at startup instead of falling back to any public route.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check verification and signing boundaries
        run: python3 scripts/ci/test_verification_boundary.py

      - name: Validate explicit release publication request
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.publish_apk_artifacts == true && inputs.build_release != true
        run: |
          echo "::error::Public APK upload requires the explicit build_release input and separate distribution approval."
          exit 1

      - name: Require main ref for release builds
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.build_release == true && github.ref != 'refs/heads/main'
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          echo "::error::Release builds with private retention are limited to refs/heads/main; got $CURRENT_REF."
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package is no longer published.
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Check owned namespace and release verifier source guards
        run: |
          python3 scripts/test_owned_namespace_boundaries.py
          python3 scripts/test_notice_asset_contract.py
          python3 scripts/owned-source-prep/test-seali-prepare-owned-producer-inputs.py
          python3 scripts/quickjs-source-preparation/test-verify-quickjs-target.py
          python3 scripts/quickjs-source-preparation/test-verify-quickjs-target-main.py
          python3 scripts/release-qualification/test-compatible-alpha7-verifier.py

      # Source verification needs no native payload and never produces an APK.
      # The candidate property admits this isolated source tree; it does not
      # admit release packaging, runtime qualification or public distribution.
      # Consumer contract CI staging awaits a source-bound producer artifact route.
      # The 38 owned-library producer units moved to the youtubedl-android fork CI.
      # Consumer tests do not replace that producer coverage or Android runtime checks.
      - name: Run generic debug unit tests
        run: ./gradlew -PfunctionalAlphaCandidate testGenericDebugUnitTest

      - name: Run buildSrc unit tests
        run: ./gradlew -p buildSrc test --console=plain

      # Verification is secret-free for every push/PR and default manual run.
      # Owner signing/release packaging require an explicit manual opt-in.
      # Public artifact upload remains separately gated and is distribution.
      - name: Validate and stage private Play upload key
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.build_release == true
        id: signing
        shell: bash
        env:
          SEALI_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SEALI_UPLOAD_KEYSTORE_BASE64 }}
          SEALI_UPLOAD_KEY_ALIAS: ${{ secrets.SEALI_UPLOAD_KEY_ALIAS }}
          SEALI_UPLOAD_KEY_PASSWORD: ${{ secrets.SEALI_UPLOAD_KEY_PASSWORD }}
          SEALI_UPLOAD_STORE_PASSWORD: ${{ secrets.SEALI_UPLOAD_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$SEALI_UPLOAD_KEYSTORE_BASE64" ]]; then
            echo "::error::Missing SEALI_UPLOAD_KEYSTORE_BASE64. Configure the four Seali upload-signing repository secrets before running a release build."
            exit 1
          fi

          for name in SEALI_UPLOAD_KEY_ALIAS SEALI_UPLOAD_KEY_PASSWORD SEALI_UPLOAD_STORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done

          umask 077
          key_file="app/seali-upload-key.jks"
          normalized_base64="$RUNNER_TEMP/seali-upload-key.base64"
          check_log="$RUNNER_TEMP/seali-keystore-check.log"
          csr_file="$RUNNER_TEMP/seali-upload-key-check.csr"
          nested_base64="$RUNNER_TEMP/seali-upload-key-nested.base64"
          nested_file="$RUNNER_TEMP/seali-upload-key-nested.bin"
          validation_succeeded=false

          cleanup_validation_files() {
            rm -f "$normalized_base64" "$check_log" "$csr_file" "$nested_base64" "$nested_file"
            if [[ "$validation_succeeded" != true ]]; then
              rm -f "$key_file"
            fi
          }
          trap cleanup_validation_files EXIT

          # PowerShell and other encoders may wrap Base64 across lines. Remove
          # whitespace only; never echo or print the secret or decoded bytes.
          printf '%s' "$SEALI_UPLOAD_KEYSTORE_BASE64" | tr -d '[:space:]' > "$normalized_base64"
          if ! base64 --decode "$normalized_base64" > "$key_file"; then
            echo "::error::SEALI_UPLOAD_KEYSTORE_BASE64 is not valid Base64. Encode the original keystore file bytes, not its path or a JSON wrapper."
            exit 1
          fi
          if [[ ! -s "$key_file" ]]; then
            echo "::error::The decoded upload keystore is empty."
            exit 1
          fi
          chmod 600 "$key_file"

          # Detect the real container from its file signature. keytool on
          # modern JDKs can transparently read legacy keystores through more
          # than one requested type, so a successful -list alone is not a
          # reliable format detector.
          magic="$(od -An -tx1 -N4 "$key_file" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          store_type=""
          case "$magic" in
            feedfeed) store_type="JKS" ;;
            30*) store_type="PKCS12" ;;
          esac

          # Recover safely if the repository secret was accidentally made by
          # Base64-encoding an already-Base64 text file. This never prints the
          # decoded data and accepts the nested result only if its binary
          # signature is a recognized JKS or PKCS12 container.
          if [[ -z "$store_type" ]]; then
            tr -d '[:space:]' < "$key_file" > "$nested_base64"
            if LC_ALL=C grep -Eq '^[A-Za-z0-9+/=]+$' "$nested_base64" &&
              base64 --decode "$nested_base64" > "$nested_file" 2>/dev/null; then
              nested_magic="$(od -An -tx1 -N4 "$nested_file" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
              case "$nested_magic" in
                feedfeed) store_type="JKS" ;;
                30*) store_type="PKCS12" ;;
              esac
              if [[ -n "$store_type" ]]; then
                mv "$nested_file" "$key_file"
                chmod 600 "$key_file"
                echo "::notice::The upload keystore secret contained an extra Base64 layer; the workflow normalized it in memory."
              fi
            fi
          fi

          if [[ -z "$store_type" ]]; then
            echo "::error::The decoded secret is not a JKS or PKCS12 keystore, even after checking for accidental double-Base64 encoding. Update the secret using one Base64 encoding of the original binary keystore file."
            exit 1
          fi

          if ! keytool -list \
            -keystore "$key_file" \
            -storetype "$store_type" \
            -storepass:env SEALI_UPLOAD_STORE_PASSWORD \
            > /dev/null 2>&1; then
            echo "::error::The decoded $store_type keystore could not be opened with the configured store password. Verify the Base64 file and store-password secret; no keystore data was logged."
            exit 1
          fi

          if ! keytool -list -v \
            -keystore "$key_file" \
            -storetype "$store_type" \
            -storepass:env SEALI_UPLOAD_STORE_PASSWORD \
            -alias "$SEALI_UPLOAD_KEY_ALIAS" > "$check_log" 2>&1; then
            echo "::error::The keystore opens successfully, but the configured alias was not found or could not be read. Check SEALI_UPLOAD_KEY_ALIAS."
            exit 1
          fi

          if ! grep -qi "Entry type: PrivateKeyEntry" "$check_log"; then
            echo "::error::The configured alias is not a private-key entry. A certificate-only keystore cannot sign Seali releases."
            exit 1
          fi

          # PKCS12 stores use the store password to protect the private key.
          # JKS supports a separate key password.
          if [[ "$store_type" == "PKCS12" && "$SEALI_UPLOAD_KEY_PASSWORD" != "$SEALI_UPLOAD_STORE_PASSWORD" ]]; then
            echo "::error::This keystore is PKCS12, which requires the private-key password and store password to match. Correct the secret values without sharing them."
            exit 1
          fi

          # Prove the private key can be unlocked without exporting it or
          # changing the keystore. The CSR is temporary and immediately erased.
          if ! keytool -certreq \
            -alias "$SEALI_UPLOAD_KEY_ALIAS" \
            -keystore "$key_file" \
            -storetype "$store_type" \
            -storepass:env SEALI_UPLOAD_STORE_PASSWORD \
            -keypass:env SEALI_UPLOAD_KEY_PASSWORD \
            -file "$csr_file" \
            > /dev/null 2>&1; then
            echo "::error::The configured private-key password cannot unlock the selected upload key."
            exit 1
          fi

          echo "store_type=$store_type" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"
          validation_succeeded=true
          echo "Upload keystore validated successfully (format: $store_type; private key and passwords verified)."
      
      - name: Build generic release APK variants
        if: steps.signing.outputs.available == 'true'
        env:
          SEALI_UPLOAD_KEY_ALIAS: ${{ secrets.SEALI_UPLOAD_KEY_ALIAS }}
          SEALI_UPLOAD_KEY_PASSWORD: ${{ secrets.SEALI_UPLOAD_KEY_PASSWORD }}
          SEALI_UPLOAD_STORE_PASSWORD: ${{ secrets.SEALI_UPLOAD_STORE_PASSWORD }}
          SEALI_UPLOAD_KEYSTORE_FILE: app/seali-upload-key.jks
          SEALI_UPLOAD_KEYSTORE_TYPE: ${{ steps.signing.outputs.store_type }}
        run: ./gradlew --no-daemon assembleGenericRelease

      # Play App Bundles own ABI delivery; disable APK split outputs for this task.
      - name: Build Google Play App Bundle
        if: steps.signing.outputs.available == 'true'
        env:
          SEALI_UPLOAD_KEY_ALIAS: ${{ secrets.SEALI_UPLOAD_KEY_ALIAS }}
          SEALI_UPLOAD_KEY_PASSWORD: ${{ secrets.SEALI_UPLOAD_KEY_PASSWORD }}
          SEALI_UPLOAD_STORE_PASSWORD: ${{ secrets.SEALI_UPLOAD_STORE_PASSWORD }}
          SEALI_UPLOAD_KEYSTORE_FILE: app/seali-upload-key.jks
          SEALI_UPLOAD_KEYSTORE_TYPE: ${{ steps.signing.outputs.store_type }}
        run: ./gradlew --no-daemon bundlePlayRelease -PnoSplits

      - name: Verify APK and AAB signatures against the upload certificate
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          SEALI_UPLOAD_KEY_ALIAS: ${{ secrets.SEALI_UPLOAD_KEY_ALIAS }}
          SEALI_UPLOAD_STORE_PASSWORD: ${{ secrets.SEALI_UPLOAD_STORE_PASSWORD }}
          SEALI_UPLOAD_KEYSTORE_TYPE: ${{ steps.signing.outputs.store_type }}
        run: |
          set -euo pipefail

          keystore="app/seali-upload-key.jks"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          apk_dir="app/build/outputs/apk/generic/release"
          aab_dir="app/build/outputs/bundle/playRelease"

          expected_fingerprint="$(
            keytool -exportcert \
              -alias "$SEALI_UPLOAD_KEY_ALIAS" \
              -keystore "$keystore" \
              -storetype "$SEALI_UPLOAD_KEYSTORE_TYPE" \
              -storepass:env SEALI_UPLOAD_STORE_PASSWORD \
              | openssl dgst -sha256 \
              | awk '{ print tolower($NF) }'
          )"

          mapfile -t apks < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' | sort)
          if [[ "${#apks[@]}" -ne 5 ]]; then
            echo "::error::Expected five ABI/universal APKs, found ${#apks[@]}."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            signer_output="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1)"
            actual_fingerprint="$(
              printf '%s\n' "$signer_output" \
                | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([[:xdigit:]:]+)$/\1/p' \
                | head -n 1 \
                | tr -d ':' \
                | tr '[:upper:]' '[:lower:]'
            )"
            if [[ -z "$actual_fingerprint" || "$actual_fingerprint" != "$expected_fingerprint" ]]; then
              echo "::error::APK signature verification failed or the APK was signed with a different certificate: $(basename "$apk")"
              exit 1
            fi
          done

          mapfile -t aabs < <(find "$aab_dir" -maxdepth 1 -type f -name '*.aab' | sort)
          if [[ "${#aabs[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Google Play AAB, found ${#aabs[@]}."
            exit 1
          fi

          jarsigner -verify "${aabs[0]}" > /dev/null
          aab_fingerprint="$(
            keytool -printcert -jarfile "${aabs[0]}" 2>/dev/null \
              | sed -nE 's/^[[:space:]]*SHA256: ([[:xdigit:]:]+).*$/\1/p' \
              | head -n 1 \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"
          if [[ -z "$aab_fingerprint" || "$aab_fingerprint" != "$expected_fingerprint" ]]; then
            echo "::error::The AAB is unsigned, invalid, or signed with a different certificate."
            exit 1
          fi

          echo "Verified all five APKs and the Google Play AAB against the configured upload certificate."

      - name: Prepare individually named release APKs
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_dir="app/build/outputs/apk/generic/release"
          output_dir="release-assets"
          mkdir -p "$output_dir"
          ref_slug="${GITHUB_REF_NAME//\//-}"

          find_one() {
            local label="$1"
            local pattern="$2"
            mapfile -t matches < <(find "$source_dir" -maxdepth 1 -type f -name "$pattern" | sort)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one $label APK matching $pattern; found ${#matches[@]}"
              find "$source_dir" -maxdepth 1 -type f -name '*.apk' -printf '%f\n'
              exit 1
            fi
            cp "${matches[0]}" "$output_dir/Seali-${ref_slug}-$label.apk"
          }

          find_one arm64-v8a '*-arm64-v8a-release.apk'
          find_one armeabi-v7a '*-armeabi-v7a-release.apk'
          find_one x86_64 '*-x86_64-release.apk'
          find_one x86 '*-x86-release.apk'

          mapfile -t universal < <(find "$source_dir" -maxdepth 1 -type f -name '*.apk' ! -name '*-arm64-v8a-release.apk' ! -name '*-armeabi-v7a-release.apk' ! -name '*-x86-release.apk' ! -name '*-x86_64-release.apk' | sort)
          if [ "${#universal[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one universal APK; found ${#universal[@]}"
            find "$source_dir" -maxdepth 1 -type f -name '*.apk' -printf '%f\n'
            exit 1
          fi
          cp "${universal[0]}" "$output_dir/Seali-${ref_slug}-universal.apk"
          ls -lh "$output_dir"

      - name: Generate release APK SHA-256 checksums
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum -- *.apk > SHA256SUMS)
          test "$(wc -l < release-assets/SHA256SUMS)" -eq 5
          echo "Generated SHA-256 checksums for all five signed APK variants."

      # Private qualification retention: keep the signed APK set and the Play
      # AAB as assets on a DRAFT release. Draft releases and their assets are
      # visible to repository collaborators only (verified live: custody draft
      # 441954416 returns 404 unauthenticated), so this is retention, not
      # distribution, and stays fully separate from the publish_apk_artifacts
      # public route below. refs/heads/main only, fail-fast gated before any
      # signing or build work. The draft targets the exact checked-out commit.
      # All operations are scoped to the release ID returned at creation -
      # never a tag lookup that could resolve to another release - and any
      # failure removes only this step's own draft after re-verifying its id,
      # tag and draft state. Draft releases create no git refs, so tag
      # uniqueness is NOT enforced by git: run_id + run_attempt keeps each
      # attempt distinct, and the post-upload check requires the exact
      # seven-asset set. The AAB is retained privately for the separately
      # authorized Play closed-testing process; nothing is uploaded to Play.
      - name: Stage private draft release assets
        if: steps.signing.outputs.available == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.build_release == true && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          ref_slug="${GITHUB_REF_NAME//\//-}"
          bundle_dir="app/build/outputs/bundle/playRelease"
          mapfile -t bundles < <(find "$bundle_dir" -maxdepth 1 -type f -name '*.aab' | sort)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Play AAB in $bundle_dir; found ${#bundles[@]}"
            exit 1
          fi
          aab_name="Seali-${ref_slug}-play.aab"
          cp "${bundles[0]}" "release-assets/$aab_name"
          # Extend the checksum manifest to cover the AAB (the previous step
          # asserted exactly 5 APK lines; require exactly 6 now).
          (cd release-assets && sha256sum -- "$aab_name" >> SHA256SUMS)
          test "$(wc -l < release-assets/SHA256SUMS)" -eq 6

          short_sha="${GITHUB_SHA:0:8}"
          tag="release-qualification/run-${{ github.run_id }}-${{ github.run_attempt }}"
          release_id=""

          delete_own_draft() {
            # Only ever delete the draft this step created: re-verify the exact
            # release id, tag and draft state first. Never resolves or touches
            # any other release.
            [ -n "$release_id" ] || return 0
            rec=$(gh api "repos/$repo/releases/$release_id" 2>/dev/null || true)
            [ -n "$rec" ] || return 0
            if [ "$(printf '%s' "$rec" | jq -r '.tag_name')" = "$tag" ] && [ "$(printf '%s' "$rec" | jq -r '.draft')" = "true" ]; then
              gh api -X DELETE "repos/$repo/releases/$release_id" >/dev/null 2>&1 || true
              echo "::notice::Removed incomplete own draft $tag (id $release_id)."
            fi
          }
          on_exit() {
            status=$?
            if [ "$status" -ne 0 ]; then
              delete_own_draft
            fi
            exit "$status"
          }
          trap on_exit EXIT

          create_response=$(gh api "repos/$repo/releases" \
            -f tag_name="$tag" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Seali alpha7 release qualification run ${{ github.run_id }} (${short_sha})" \
            -f body="Private release-qualification assets for commit $GITHUB_SHA (${{ github.server_url }}/$repo/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}). build_release=${{ inputs.build_release }}, publish_apk_artifacts=${{ inputs.publish_apk_artifacts }}. Draft release: collaborators only, not a public release. Play upload remains a separately approved process." \
            -F draft=true -F prerelease=true)
          release_id=$(printf '%s' "$create_response" | jq -r '.id')
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "::error::Draft release creation returned no id."
            exit 1
          fi

          upload_base="https://uploads.github.com/repos/$repo/releases/$release_id/assets"
          for asset in release-assets/*.apk release-assets/*.aab release-assets/SHA256SUMS; do
            name="$(basename "$asset")"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              "$upload_base?name=$name" >/dev/null
          done

          # Require the exact expected asset set; a partial draft is not ready.
          mapfile -t expected < <(cd release-assets && ls -- *.apk *.aab SHA256SUMS | sort)
          mapfile -t actual < <(gh api "repos/$repo/releases/$release_id" --jq '.assets[].name' | sort)
          if [ "${#expected[@]}" -ne 7 ] || ! diff <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}") >/dev/null; then
            echo "::error::Draft asset mismatch for $tag (id $release_id). Expected:"; printf '%s\n' "${expected[@]}"
            echo "::error::Uploaded:"; printf '%s\n' "${actual[@]}"
            exit 1
          fi
          echo "Private draft release $tag (id $release_id) staged with exactly 7 verified assets."
          trap - EXIT

      # Play builds are validated but never distributed as GitHub artifacts.
      # Upload to Google Play only through its separately approved process.

      # Keep each ABI downloadable on its own from the Actions run.
      - name: Upload ARM64 APK
        if: steps.signing.outputs.available == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.publish_apk_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: seali-arm64-v8a
          path: release-assets/*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARMv7 APK
        if: steps.signing.outputs.available == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.publish_apk_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: seali-armeabi-v7a
          path: release-assets/*-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 APK
        if: steps.signing.outputs.available == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.publish_apk_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: seali-x86
          path: release-assets/*-x86.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK
        if: steps.signing.outputs.available == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.publish_apk_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: seali-x86_64
          path: release-assets/*-x86_64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload universal APK
        if: steps.signing.outputs.available == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.publish_apk_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: seali-universal
          path: release-assets/*-universal.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release checksums
        if: steps.signing.outputs.available == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.publish_apk_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: seali-checksums
          path: release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      # Public GitHub APK publication is handled only by the guarded draft
      # staging workflow. A tag build must not mutate an existing release.

      # The signing key is needed only until packaging and verification finish.
      # Always remove it from the ephemeral runner, including failed builds.
      - name: Remove private signing material
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.build_release == true
        shell: bash
        run: |
          rm -f app/seali-upload-key.jks "$RUNNER_TEMP/seali-upload-key.base64" "$RUNNER_TEMP/seali-keystore-check.log" "$RUNNER_TEMP/seali-upload-key-check.csr" "$RUNNER_TEMP/seali-upload-key-nested.base64" "$RUNNER_TEMP/seali-upload-key-nested.bin"

  history-ui:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.run_history_ui == true && inputs.qualify_maven_consumer != true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v3
      - name: Verify existing runner KVM access without changing permissions
        run: |
          if [ ! -c /dev/kvm ] || [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::This runtime check requires a runner with existing read/write KVM access. No host permissions were changed."
            exit 1
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew assembleGenericDebug assembleGenericDebugAndroidTest
            find app/build/outputs/apk/generic/debug -name '*x86_64*.apk' -print -quit | xargs adb install -r
            find app/build/outputs/apk/androidTest/generic/debug -name '*.apk' -print -quit | xargs adb install -r
            adb shell am instrument -w -r -e class com.frpboy.seali.ClassicHomeHistoryTest com.frpboy.seali.debug.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation-result.txt
            grep -F 'OK (2 tests)' instrumentation-result.txt
            ! grep -E 'FAILURES|INSTRUMENTATION_FAILED|shortMsg=' instrumentation-result.txt
            adb exec-out run-as com.frpboy.seali.debug cat files/classic-history.png > classic-history.png
            test -s classic-history.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-history-ui-evidence
          path: |
            classic-history.png
            instrumentation-result.txt
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/

  maven-consumer-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.qualify_maven_consumer == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check explicit consumer source
        env:
          EXPECTED_SHA: ${{ inputs.expected_qualification_sha }}
          BUILD_RELEASE: ${{ inputs.build_release }}
          PUBLISH_APK: ${{ inputs.publish_apk_artifacts }}
          HISTORY_UI: ${{ inputs.run_history_ui }}
        run: |
          set -euo pipefail
          test "$BUILD_RELEASE" = false
          test "$PUBLISH_APK" = false
          test "$HISTORY_UI" = false
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check out public producer at reviewed immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: frpboy/youtubedl-android
          ref: 03deec547243ebe120a537e38d667a3a1ffc588e
          path: .qualification/producer
          persist-credentials: false
      - name: Verify producer source and self-contained policy tests
        run: |
          set -euo pipefail
          python3 scripts/build-contract/check-pinned-producer.py --root . --producer .qualification/producer
          python3 scripts/ci/test_verification_boundary.py
          python3 scripts/release-qualification/test-compatible-alpha7-verifier.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Install compile platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build public producer locally and execute its 38 units
        working-directory: .qualification/producer
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :common:publishReleasePublicationToStagingRepository :library:publishReleasePublicationToStagingRepository :ffmpeg:publishReleasePublicationToStagingRepository :library:testReleaseUnitTest
          python3 scripts/verify-publication.py --repository build/staging-deploy --group io.github.frpboy.youtubedl-android --version 0.1.0-alpha.7 --engine-sha256 "$(cat engine-sha256.txt)" --engine-checker-sha256 "$(cat engine-checker-sha256.txt)"
      - name: Require exact reviewed artifact bytes without automatic lock regeneration
        run: |
          set -euo pipefail
          test ! -e .qualification/maven
          cp -R .qualification/producer/build/staging-deploy .qualification/maven
          python3 scripts/build-contract/verify-alpha7-maven.py --root . --lock scripts/build-contract/alpha7-maven-lock.json
          python3 scripts/build-contract/test-maven-inputs.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile actual consumer and run app/buildSrc units, no APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon -PfunctionalAlphaCandidate :app:verifyGenericDebugReviewedMaven :app:compileGenericDebugKotlin :app:testGenericDebugUnitTest
          ./gradlew --no-daemon -p buildSrc test
      # No upload, native staging, APK, signing, secrets, dispatch, release or public registry.
