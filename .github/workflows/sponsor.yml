name: Generate Sponsors README
on:
  workflow_dispatch:
  schedule:
    - cron: 30 15 25 * *
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Inherited upstream automation is intentionally disabled for Seali.
    # Do not enable sponsor writes, automatic issue closure or stale closure as a rebrand.
    if: ${{ false }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v2

      - name: Generate Sponsors 💖
        uses: JamesIves/github-sponsors-readme-action@v1
        with:
          token: ${{ secrets.PAT }}
          file: 'README.md'
          minimum: 500

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: main
          token: ${{ secrets.PAT }}
          folder: '.'
          commit-message: 'docs(readme): update sponsor info'
