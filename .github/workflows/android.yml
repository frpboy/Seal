name: Build Release APK

# Keep the original manual release entry point, but delegate to the canonical
# Android CI workflow so signing validation and artifact verification cannot
# be bypassed by this workflow.
on:
  workflow_dispatch:
    inputs:
      publish_apk_artifacts:
        description: 'Publish validated release APKs and checksums as public Actions artifacts'
        type: boolean
        required: false
        default: false

# contents:write is required so the called android_ci.yml build job can stage
# the signed outputs on a private draft release (collaborator-only retention,
# not distribution). Public artifact upload stays separately gated on the
# publish_apk_artifacts input, which defaults to false.
permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/android_ci.yml
    with:
      build_release: true
      publish_apk_artifacts: ${{ inputs.publish_apk_artifacts }}
    secrets: inherit
