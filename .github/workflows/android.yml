name: Seali unsigned native qualification (manual only)

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact independently reviewed full SHA, one attempt
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seali-unsigned-native-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Guard exact source and fresh attempt
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == frpboy/Seal ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_HEAD" && "$(git rev-parse HEAD)" == "$EXPECTED_HEAD" ]]
          [[ -z "$(git status --porcelain)" ]]
          [[ ! -e keystore.properties ]]
          mkdir qualification-evidence
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          Path('qualification-evidence/source.json').write_text(json.dumps({
              'source_sha': os.environ['GITHUB_SHA'],
              'source_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'channel': 'alpha diagnostic only', 'signing': 'no signing config or keys supplied',
              'android_runtime': 'NOT EXECUTED', 'aab': 'NOT BUILT',
              'artifact_delivery': 'APK remains runner-local and is not uploaded'
          }, indent=2)+'\n')
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Resource and toolchain preflight
        shell: bash
        run: |
          set -euo pipefail
          # Standard Linux host only. Fail rather than retry with guessed memory caps.
          (( $(awk '/MemTotal/{print $2}' /proc/meminfo) >= 6000000 ))
          (( $(nproc) >= 2 ))
          (( $(df -Pk . | awk 'NR==2{print $4}') >= 12000000 ))
          # Exact recipe contract, not the caller's wider PATH.
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
          [[ "$ImageOS" == ubuntu24 && "$ImageVersion" == 20261101.360.1 ]]
          /usr/bin/python3 native/qualification/host-cmake-contract.py before
          # Proposed scoped disposable-host adaptation. Never replace an entry.
          # Requires separate approval for this exact elevated operation.
          /usr/bin/sudo -n /usr/bin/ln -sT -- /usr/local/bin/cmake /usr/bin/cmake
          /usr/bin/python3 native/qualification/host-cmake-contract.py after
          for tool in cmake make python3 curl unzip timeout tar sha256sum env; do
            [[ -x "/usr/bin/$tool" ]]
            /usr/bin/readlink -f "/usr/bin/$tool"
          done
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C TZ=UTC /usr/bin/cmake --version
          java -version
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -h || true
          chmod +x gradlew
      - name: Actual AGP variant selection then unsigned universal APK
        shell: bash
        run: |
          set -euo pipefail
          bash native/qualification/run-phases.sh
      - name: Inspect packaged native entries and APK ZIP alignment separately
        shell: bash
        run: |
          set -euo pipefail
          python3 native/qualification/inspect-apk.py
          mapfile -t apks < <(find app/build/outputs/apk/generic/nativeQualification -maxdepth 1 -name '*.apk' -type f)
          [[ ${#apks[@]} == 1 ]]
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "${apks[0]}" > qualification-evidence/zipalign.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "${apks[0]}" > qualification-evidence/apk-badging.txt
          cp app/build/outputs/apk/generic/nativeQualification/output-metadata.json qualification-evidence/output-metadata.json
          python3 native/qualification/verify-metadata.py
      - name: Terminal receipt (including failures)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-evidence
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence = Path('qualification-evidence')
          total = sum(p.stat().st_size for p in evidence.iterdir() if p.is_file())
          if total > 8 * 1024 * 1024:
              raise SystemExit('Receipt ceiling exceeded; no receipt emission allowed')
          Path('qualification-evidence/terminal.json').write_text(json.dumps({
              'job_status_before_receipt': os.environ['JOB_STATUS'],
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'android_runtime': 'NOT EXECUTED', 'release_ready': False
          }, indent=2)+'\n')
          PY
      - name: Emit bounded allowlisted receipts to ordinary workflow log only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYLOG'
          import base64, hashlib, json
          from pathlib import Path
          root = Path('qualification-evidence')
          names = ['source.json', 'terminal.json', 'gradle-terminal.json',
                   'genericNativeQualificationCompileClasspath.json',
                   'genericNativeQualificationRuntimeClasspath.json',
                   'native-inventory.json', 'zipalign.txt', 'apk-badging.txt',
                   'output-metadata.json', 'expected-identity.json', 'verified-identity.json']
          rows = []
          total = 0
          for name in names:
              path = root / name
              if path.is_symlink():
                  raise SystemExit('Symlink receipt rejected')
              if not path.exists():
                  continue
              if not path.is_file():
                  raise SystemExit('Non-file receipt rejected')
              with path.open('rb') as stream:
                  data = stream.read(8 * 1024 * 1024 + 1)
              total += len(data)
              if total > 8 * 1024 * 1024:
                  raise SystemExit('Receipt ceiling exceeded; no receipt bytes emitted')
              rows.append((name, data))
          # Encode bytes so receipt text cannot become workflow commands.
          # No artifact/cache API or job summary is used. Missing files remain missing.
          print('SEALI_RECEIPTS_BEGIN_V1 ' + json.dumps({'files': [name for name, _ in rows], 'bytes': total}))
          for name, data in rows:
              print('SEALI_FILE ' + json.dumps({'name': name, 'bytes': len(data),
                    'sha256': hashlib.sha256(data).hexdigest()}))
              encoded = base64.b64encode(data).decode('ascii')
              for offset in range(0, len(encoded), 16384):
                  print('SEALI_DATA ' + encoded[offset:offset + 16384])
              print('SEALI_FILE_END')
          print('SEALI_RECEIPTS_END_V1')
          PYLOG
